<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1c">
  <title>Insígnias — PEAK Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/badges.css}">
</head>
<body class="badges-page">
  <div th:replace="~{fragments/header :: siteHeader}"></div>
  <main class="badges-main">
    <section class="badges-hero" aria-labelledby="badges-title">
      <img class="badges-banner"
           th:src="@{/images/badges/image-5.png}"
           alt=""
           aria-hidden="true">
      <img class="badges-decoration badges-decoration--left"
           th:src="@{/images/badges/image-7.png}"
           alt=""
           aria-hidden="true">
      <img class="badges-decoration badges-decoration--right"
           th:src="@{/images/badges/image-9.png}"
           alt=""
           aria-hidden="true">
      <img class="badges-decoration badges-decoration--center"
           th:src="@{/images/badges/image-8.png}"
           alt=""
           aria-hidden="true">
      <h1 id="badges-title">Insígnias</h1>
    </section>

    <section class="badge-grid" aria-label="Lista de insígnias">
      <article class="badge-card" th:each="badge : ${badges}">
        <div class="badge-icon">
          <img class="badge-base"
               th:if="${badge.baseImage != null}"
               th:src="@{/images/badges/{image}(image=${badge.baseImage})}"
               alt=""
               aria-hidden="true">
          <img class="badge-art"
               th:src="@{/images/badges/{image}(image=${badge.image})}"
               th:style="'--badge-image-size:' + ${badge.imageSize} + 'px'"
               alt=""
               aria-hidden="true">
        </div>
        <h2 class="badge-name" th:text="${badge.name}">Insígnia</h2>
        <p class="badge-description" th:text="${badge.description}">Descrição da insígnia.</p>
      </article>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
