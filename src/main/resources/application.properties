spring.application.name=Web

# Banco de dados (PostgreSQL no Neon).
# A senha fica no arquivo .env (fora do Git). Veja o .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-morning-art-b6wnfucf-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload de imagens da Comunidade. A página já reduz a imagem para HD (até 1 MB) antes de enviar;
# estes limites só barram arquivos enviados sem passar por essa redução.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Deixa o Tomcat ler o envio grande até o fim, para conseguir responder com o aviso em vez de cortar a conexão.
server.tomcat.max-swallow-size=20MB

# Mantém a sessão (usada no aviso de "postagem publicada") só em cookie, sem ;jsessionid na URL.
server.servlet.session.tracking-modes=cookie
