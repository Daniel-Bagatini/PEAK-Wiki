<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>PEAK — Nova postagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/comunidade.css}">
  <link rel="stylesheet" th:href="@{/css/nova-postagem.css}">
</head>
<body class="community-page">
  <div th:replace="~{fragments/header :: siteHeader}"></div>

  <main class="community-main">
    <h1>Nova postagem</h1>

    <form class="new-post-form" th:action="@{/comunidade/nova-postagem}" th:object="${form}" method="post"
          enctype="multipart/form-data" novalidate>
      <div class="new-post-field">
        <label for="autor">Apelido</label>
        <input id="autor" type="text" th:field="*{autor}" placeholder="@seu_apelido"
               maxlength="30"
               th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid'" required>
        <p class="new-post-error" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}">Erro</p>
      </div>

      <div class="new-post-field">
        <label for="texto">O que você quer compartilhar?</label>
        <textarea id="texto" rows="6" th:field="*{texto}"
                  placeholder="Uma dica, estratégia ou build que te ajudou a chegar no PICO..."
                  maxlength="500"
                  th:classappend="${#fields.hasErrors('texto')} ? 'is-invalid'" required></textarea>
        <p class="new-post-error" th:if="${#fields.hasErrors('texto')}" th:errors="*{texto}">Erro</p>
      </div>

      <div class="new-post-field">
        <span class="new-post-label" id="imagem-titulo">Imagem <small>(opcional)</small></span>
        <label class="new-post-drop" for="imagem" data-area-imagem
               th:classappend="${#fields.hasErrors('imagem') or param.imagemGrande != null} ? 'is-invalid'">
          <input id="imagem" name="imagem" type="file" class="visually-hidden"
                 accept="image/png,image/jpeg,image/webp" aria-describedby="imagem-dica">
          <span class="new-post-drop-icon" aria-hidden="true">📷</span>
          <span class="new-post-drop-text">Arraste uma imagem aqui ou <u>clique para escolher</u></span>
          <span class="new-post-drop-hint" id="imagem-dica">PNG, JPG ou WebP. Ela é reduzida para no máximo 1280×720 (HD).</span>
        </label>

        <div class="new-post-preview" data-previa hidden>
          <img alt="Prévia da imagem escolhida" data-previa-img>
          <div class="new-post-preview-info">
            <span data-previa-info></span>
            <button type="button" data-remover-imagem>Remover imagem</button>
          </div>
        </div>

        <p class="new-post-error" th:if="${#fields.hasErrors('imagem')}" th:errors="*{imagem}">Erro</p>
        <p class="new-post-error" th:if="${param.imagemGrande != null}">O arquivo é grande demais. Escolha uma imagem menor.</p>
        <p class="new-post-error" data-erro-imagem role="alert" hidden></p>
      </div>

      <div class="new-post-actions">
        <a th:href="@{/comunidade}">Cancelar</a>
        <button type="submit">Publicar</button>
      </div>
    </form>
  </main>

  <div th:replace="~{fragments/footer :: siteFooter}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/nova-postagem.js}" defer></script>
</body>
</html>
