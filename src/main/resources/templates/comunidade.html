<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>PEAK — Comunidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/comunidade.css}">
</head>
<body class="community-page">
  <div th:replace="~{fragments/header :: siteHeader}"></div>

  <main class="community-main">
    <h1>Comunidade</h1>

    <p class="community-flash" th:if="${publicada}" role="status">Sua postagem foi publicada!</p>
    <p class="community-flash" th:if="${apagada}" role="status">A postagem foi apagada.</p>

    <div class="community-actions">
      <a class="community-new-post" th:href="@{/comunidade/nova-postagem}">+ Nova postagem</a>
    </div>

    <section class="community-feed" aria-label="Publicações da comunidade">
      <p class="community-empty" th:if="${#lists.isEmpty(postagens)}">Ainda não há postagens. Seja o primeiro!</p>


      <!-- Todas as postagens, da mais recente para a mais antiga, viram quadros de HQ. Cada quadro ganha o
           formato da sua foto, e o mosaico se reorganiza sozinho quando entra uma postagem nova
           (veja .community-comic no comunidade.css e o comunidade.js). -->
      <div class="community-comic" th:unless="${#lists.isEmpty(postagens)}">
        <th:block th:each="post : ${postagens}">
          <article th:replace="~{fragments/postagem :: postagem(${post})}"></article>
        </th:block>
      </div>

      <div class="community-participation">
        <p>Participe também da comunidade compartilhando uma dica, estratégia ou build que te ajudou a chegar no PICO!!!</p>
        <a th:href="@{/comunidade/nova-postagem}">Criar uma postagem</a>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: siteFooter}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/comunidade.js}" defer></script>
</body>
</html>
