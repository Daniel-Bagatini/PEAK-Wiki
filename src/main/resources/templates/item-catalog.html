<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1c">
  <title th:text="|${catalog.title} — PEAK Wiki|">Itens — PEAK Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/item-catalog.css}">
</head>
<body class="catalog-page" th:classappend="${catalog.food} ? ' catalog-page--food' : ' catalog-page--equipment'"
      th:style="'--biome-background: url(/images/biome-pages/costa/imgImage167.png)'">
  <div th:replace="~{fragments/header :: siteHeader}"></div>
  <main class="catalog-main">
    <h1 class="visually-hidden" th:text="${catalog.title}">Comidas</h1>

    <nav class="catalog-summary" aria-labelledby="catalog-summary-title">
      <h2 id="catalog-summary-title">Sumário</h2>
      <ol>
        <li th:each="section, iterStat : ${catalog.sections}">
          <a th:href="|#${section.id}|">
            <span class="summary-number" th:text="|${iterStat.count}.|">1.</span>
            <span th:text="${section.title}">Categoria</span>
          </a>
        </li>
      </ol>
    </nav>

    <section class="catalog-section" th:each="section : ${catalog.sections}"
             th:id="${section.id}" th:aria-labelledby="|${section.id}-title|">
      <h2 class="catalog-section-title" th:id="|${section.id}-title|" th:text="${section.title}">Naturais</h2>
      <div class="table-responsive catalog-table-wrap">
        <table class="table catalog-table" th:classappend="${catalog.food} ? ' catalog-table--food' : ' catalog-table--equipment'">
          <thead>
            <tr th:if="${catalog.food}">
              <th scope="col">Ícone</th>
              <th scope="col">Nome</th>
              <th scope="col">Efeito</th>
              <th scope="col">Efeito (Cozido)</th>
              <th scope="col">Locais</th>
              <th scope="col">Peso</th>
            </tr>
            <tr th:unless="${catalog.food}">
              <th scope="col">Ícone</th>
              <th scope="col">Nome</th>
              <th scope="col">Peso</th>
              <th scope="col">Locais</th>
              <th scope="col">Descrição</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${section.items}">
              <td class="catalog-icons">
                <img th:each="image : ${item.images}" th:src="${image}" th:alt="${item.name}" loading="lazy">
                <span th:if="${#lists.isEmpty(item.images)}" class="catalog-icon-empty" aria-hidden="true"></span>
              </td>
              <th scope="row" th:text="${item.name}">Item</th>
              <td th:if="${catalog.food}">
                <span th:if="${!#strings.isEmpty(item.effect)}" th:text="${item.effect}"></span>
                <small class="catalog-note" th:if="${!#strings.isEmpty(item.description)}"
                       th:text="${item.description}"></small>
              </td>
              <td th:if="${catalog.food}" th:text="${item.cookedEffect}"></td>
              <td th:if="${catalog.food}" th:text="${item.locations}"></td>
              <td class="catalog-weight">
                <span class="catalog-weight-value">
                  <img class="catalog-weight-icon"
                       th:src="@{/images/items/equipamentos/imgImage203.png}" alt="">
                  <span th:text="${item.weight}">2,5</span>
                </span>
              </td>
              <td th:unless="${catalog.food}" th:text="${item.locations}"></td>
              <td th:unless="${catalog.food}" th:text="${item.description}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: siteFooter}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
