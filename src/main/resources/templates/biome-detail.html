<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1c">
  <title th:text="|${biome.name} — PEAK Wiki|">Bioma — PEAK Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/biome-detail.css}">
</head>
<body class="biome-page"
      th:style="'--biome-background: url(/images/biome-pages/' + ${biome.slug} + '/' + ${biome.backdrop} + ')'">
  <div th:replace="~{fragments/header :: siteHeader}"></div>
  <main class="biome-page-main">
    <section class="biome-hero" th:attr="aria-label=|Bioma ${biome.name}|">
      <div class="biome-title-frame">
        <img class="biome-title-art"
             th:src="@{/images/biome-pages/{slug}/{image}(slug=${biome.slug},image=${biome.banner})}"
             alt="">
        <img class="biome-title-overlay"
             th:each="overlay : ${biome.titleOverlays}"
             th:src="@{/images/biome-pages/{slug}/{image}(slug=${biome.slug},image=${overlay})}"
             alt="">
        <h1 th:text="${biome.name}">Costa</h1>
      </div>
      <section class="biome-intro" aria-labelledby="biome-intro-title">
        <h2 id="biome-intro-title">CARACTERÍSTICAS DO BIOMA</h2>
        <p th:text="${biome.description}">Descrição do bioma.</p>
      </section>
    </section>

    <section class="biome-foods" aria-labelledby="biome-foods-title" th:if="${!#lists.isEmpty(biome.foods)}">
      <h2 id="biome-foods-title">CONSUMÍVEIS NATURAIS DO BIOMA</h2>
      <ul class="food-grid">
        <li class="food-item" th:each="food : ${biome.foods}">
          <div class="food-icons">
            <img th:each="foodImage : ${food.images}"
                 th:src="@{/images/biome-pages/{slug}/{image}(slug=${biome.slug},image=${foodImage})}"
                 alt="">
          </div>
          <span th:text="${food.name}">Coco</span>
        </li>
      </ul>
    </section>
    <ul class="food-effect-legend" aria-label="Efeitos dos consumíveis" th:if="${!#lists.isEmpty(biome.foodEffects)}">
      <li th:each="effect : ${biome.foodEffects}">
        <span class="effect-dot" th:classappend="| effect-${effect.cssClass}|" aria-hidden="true"></span>
        <span th:text="${effect.label}">Efeito do consumível</span>
      </li>
    </ul>

    <section class="biome-dangers" aria-labelledby="biome-dangers-title" th:if="${!#lists.isEmpty(biome.hazards)}">
      <h2 id="biome-dangers-title">PERIGOS DO BIOMA</h2>
      <div class="danger-list">
        <article class="danger-row" th:each="hazard : ${biome.hazards}">
          <img class="danger-image"
               th:src="@{/images/biome-pages/{slug}/{image}(slug=${biome.slug},image=${hazard.image})}"
               th:alt="${hazard.title}">
          <div class="danger-copy">
            <h3 th:text="${hazard.title}">Perigo</h3>
            <p th:text="${hazard.description}">Descrição do perigo.</p>
            <span class="hazard-effect"
                  th:classappend="| effect-${hazard.effectClass}|"
                  th:text="${hazard.effect}">EFEITO</span>
          </div>
        </article>
      </div>
    </section>

    <section class="biome-arrival" aria-labelledby="biome-arrival-title" th:if="${!#lists.isEmpty(biome.arrival)}">
      <h2 id="biome-arrival-title">A CHEGADA</h2>
      <article class="arrival-card" th:each="section : ${biome.arrival}">
        <p th:text="${section.description}">Descrição da chegada.</p>
        <img th:src="@{/images/biome-pages/{slug}/{image}(slug=${biome.slug},image=${section.image})}"
             th:alt="${section.alt}">
      </article>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: siteFooter}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/biomes.js}" defer></script>
</body>
</html>
