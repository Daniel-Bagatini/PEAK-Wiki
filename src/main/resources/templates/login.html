<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>PEAK — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">
  <div th:replace="~{fragments/header :: siteHeader}"></div>

  <main class="login-shell">
    <section class="login-frame" aria-label="Página de Login PEAK">
      <aside class="login-visual" aria-hidden="true">
        <div class="login-visual__badge">PEAK</div>
        <div class="login-visual__content">
          <p class="eyebrow">Sua jornada começa aqui</p>
          <h2>Explore o mundo, suba mais alto e construa sua história.</h2>
        </div>
        <div class="login-visual__mountain">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </aside>

      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card__header">
          <span class="login-kicker">Acesso</span>
          <h1 id="login-title">Entrar</h1>
        </div>

        <form class="login-form" method="post" action="#">
          <label class="field" for="email">
            <span>E-mail</span>
            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
          </label>

          <label class="field" for="password">
            <span>Senha</span>
            <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          </label>

          <div class="login-options">
            <label class="remember-me" for="remember">
              <input id="remember" name="remember" type="checkbox">
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="link-recovery">Esqueci minha senha</a>
          </div>

          <button class="primary-button" type="submit">Entrar</button>
          <button class="secondary-button" type="button">Criar conta</button>
        </form>

        <p class="login-footer">
          Ainda não tem uma conta?
          <a href="#">Cadastre-se</a>
        </p>
      </section>
    </section>
  </main>
</body>
</html>
