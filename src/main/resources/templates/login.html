<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe0">
  <meta name="description" content="Entre na PEAK Wiki para acompanhar biomas, itens e a comunidade do jogo.">
  <title>PEAK, Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Darumadrop+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/login-tokens.css}">
  <link rel="stylesheet" th:href="@{/css/login-base.css}">
  <link rel="stylesheet" th:href="@{/css/login-hum.css}">
</head>
<body class="login-page">
  <div th:replace="~{fragments/login-header :: loginHeader}"></div>

  <main class="login-main">
    <section class="login-sheet" aria-labelledby="login-title">
      <h1 id="login-title">Entrar</h1>
      <p class="login-lead">Sua jornada começa aqui</p>

      <form class="login-form" method="post" action="#">
        <label class="field" for="email">
          <span>E-mail</span>
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
        </label>

        <label class="field" for="password">
          <span>Senha</span>
          <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </label>

        <div class="login-options">
          <label class="remember-me" for="remember">
            <input id="remember" name="remember" type="checkbox">
            <span>Lembrar-me</span>
          </label>
          <a th:href="@{/recuperar-senha}" class="link-recovery">Esqueci minha senha</a>
        </div>

        <button class="btn btn--primary" type="submit">Entrar</button>
        <a class="btn btn--quiet" th:href="@{/cadastro}">Criar conta</a>
      </form>

      <p class="login-switch">
        Ainda não tem uma conta?
        <a th:href="@{/cadastro}">Cadastre-se</a>
      </p>
    </section>

    <figure class="login-photo">
      <img th:src="@{/images/biomes/pico.webp}" alt="O Pico, o topo da montanha, com uma bandeira no cume ao pôr do sol" width="1200" height="674">
      <figcaption>Explore o mundo, suba mais alto e construa sua história.</figcaption>
    </figure>
  </main>

  <div th:replace="~{fragments/login-footer :: loginFooter}"></div>
</body>
</html>
